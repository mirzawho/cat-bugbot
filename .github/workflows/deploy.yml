name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "value=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.sha.outputs.value }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys only when Kubernetes access is configured. Without KUBE_CONFIG the
  # job is skipped (not failed), so build & publish keep working on their own.
  check-deploy-config:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - id: check
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG secret is not set; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: [build-and-push, check-deploy-config]
    runs-on: ubuntu-latest
    if: needs.check-deploy-config.outputs.enabled == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      - name: Apply manifests and roll out
        env:
          NEW_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          sed -i "s#^\( *\)image: ghcr.io/OWNER/bugbot:latest#\1image: ${NEW_IMAGE}#" k8s.yaml
          grep -q "${NEW_IMAGE}" k8s.yaml
          kubectl apply -f k8s.yaml
          kubectl -n bugbot rollout status deployment/bugbot --timeout=180s
